<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Car Hisaab — investment tracker</title>
<meta name="description" content="Every car, every rupee spent, every payment received — and exactly how much profit share is still owed.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234a3aa7'/%3E%3Cg fill='none' stroke='white' stroke-width='2' stroke-linecap='round'%3E%3Ccircle cx='12' cy='12' r='6.2'/%3E%3Cpath d='M12 5.8v2.6M12 15.6v2.6M5.8 12h2.6M15.6 12h2.6'/%3E%3C/g%3E%3Ccircle cx='12' cy='12' r='2.2' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="2.8" fill="currentColor"/>
          <path d="M12 4v3.2M12 16.8V20M4 12h3.2M16.8 12H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">Car Hisaab</span>
        <span class="brand-sub">Investment tracker</span>
      </span>
    </div>

    <nav class="nav" id="sidebar-nav" aria-label="Sections"></nav>

    <div class="sidebar-foot">
      <div id="conn-slot"></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div style="min-width:0">
        <h1 id="page-title">Dashboard</h1>
        <div class="topbar-sub" id="page-sub"></div>
      </div>
      <div class="topbar-actions">
        <span id="topbar-add"></span>
        <button class="btn btn-ghost btn-icon" id="theme-btn" aria-label="Switch theme" title="Switch theme">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 8a2.83 2.83 0 1 0 4 4"/><path d="M12 2v2"/><path d="M12 20v2"/>
            <path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/>
            <path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/>
            <path d="m19.07 4.93-1.41 1.41"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="view" id="view" role="region" aria-live="polite" aria-label="Content"></div>
  </main>

</div>

<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<noscript>
  <div style="padding:24px;max-width:60ch;margin:0 auto">
    <h1>Car Hisaab</h1>
    <p>This tracker needs JavaScript to calculate the figures. The underlying data is
    plain JSON and readable without it:
    <a href="data/cars.json">cars.json</a>, <a href="data/payouts.json">payouts.json</a>,
    <a href="data/capital.json">capital.json</a>.</p>
  </div>
</noscript>

<!-- Chart.js 4.4.1, MIT, vendored in the repo (assets/vendor/) rather than loaded from a
     CDN, so the dashboard keeps working if the CDN is blocked or goes down. -->
<script src="assets/vendor/chart.umd.min.js" defer></script>
<script src="assets/js/calc.js" defer></script>
<script src="assets/js/icons.js" defer></script>
<script src="assets/js/art.js" defer></script>
<script src="assets/js/charts.js" defer></script>
<script src="assets/js/seed.js" defer></script>
<script src="assets/js/github.js" defer></script>
<script src="assets/js/render.js" defer></script>
<script src="assets/js/views.js" defer></script>
<script src="assets/js/app.js" defer></script>
<script>
/* The only inline script: the theme button, wired before app.js finishes booting
   so a first-time visitor can flip the theme even on a slow connection. */
document.addEventListener('click', function (event) {
  var btn = event.target.closest('#theme-btn');
  if (!btn) return;
  var root = document.documentElement;
  var isDark = root.getAttribute('data-theme') === 'dark' ||
    (!root.getAttribute('data-theme') &&
      window.matchMedia('(prefers-color-scheme: dark)').matches);
  root.setAttribute('data-theme', isDark ? 'light' : 'dark');
  try { localStorage.setItem('carhisaab.theme', isDark ? 'light' : 'dark'); } catch (e) {}
  if (window.App) window.App.boot({ keepView: true });
});
</script>

</body>
</html>
